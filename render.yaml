services:
  - type: web
    name: cherie-finance
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cheries_finance
      - key: JWT_SECRET
        generateValue: true
