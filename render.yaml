services:
  - type: web
    name: cherie-finance-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cheries_finance
      - key: JWT_SECRET
        generateValue: true
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "10"

  - type: web
    name: cherie-finance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cherie-finance-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
